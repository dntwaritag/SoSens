services:
  - type: web
    name: sosens-api
    env: python
    region: oregon
    plan: free
    runtime: python-3.11
    buildCommand: |
      cd app && \
      pip install --upgrade pip && \
      pip install -r requirements.txt && \
      echo "Build complete - checking model files..." && \
      ls -la models/ || echo "Models directory will be populated at runtime"
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: sosens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: sosens-db
    plan: free
    databaseName: sosens
    user: sosens_user